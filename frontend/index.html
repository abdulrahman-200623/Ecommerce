<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechZone | Authentic Electronics & Tech Retail</title>
    <meta name="description" content="Shop genuine flagship smartphones, creator laptops, studio acoustics, and smart wearables with official warranty and free express delivery at TechZone." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var p = window.location.pathname || '';
          if (!p.startsWith('/admin') && !p.startsWith('/superadmin')) {
            var saved = localStorage.getItem('techzone_theme');
            var theme = saved === 'dark' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            if (theme === 'dark') {
              document.documentElement.classList.add('tz-dark-mode');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
